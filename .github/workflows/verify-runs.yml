# Every pull request that touches runs or games must still replay every run. A run proposed from the game's
# Submit button does not rebuild data/runs/index.json, so a pull request may leave the index alone; but one that
# changes it must change it to exactly what the run files rebuild to, since the home page trusts the index.
name: Verify runs

on:
  pull_request:
    paths: ["data/**", "games/**", "tools/verify.mjs", "tools/build-index.mjs"]
  push:
    branches: [main]
    paths: ["data/**", "games/**"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Install the replay browser
        working-directory: tools
        run: npm ci && npx playwright install --with-deps chromium
      - name: Unit tests
        working-directory: tools
        run: npm test
      - name: Replay every run
        working-directory: tools
        run: |
          python3 -m http.server 8765 --directory .. > /dev/null 2>&1 &
          sleep 1
          node verify.mjs
      - name: Scoreboard index is current
        if: github.event_name == 'push'
        working-directory: tools
        run: node build-index.mjs --check
      - name: A changed scoreboard index matches the runs
        if: github.event_name == 'pull_request'
        run: |
          git fetch -q --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          if git diff --quiet FETCH_HEAD -- data/runs/index.json; then
            echo "data/runs/index.json is unchanged; the maintainer rebuilds it on merge"
          else
            cd tools && node build-index.mjs --check
          fi
