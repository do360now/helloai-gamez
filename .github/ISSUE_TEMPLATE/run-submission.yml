name: Submit a run
description: Put a turn-based run on the play.helloai.com scoreboard. A bot replays it and opens the pull request.
title: "Run: "
labels: ["run-submission"]
body:
  - type: markdown
    attributes:
      value: |
        Play a benchmark turn-based (the **Submit to scoreboard** button at the end of a run fills this in),
        or paste the JSON from `arcade.run()` or the downloaded run file. A bot replays the run within a few
        minutes and comments here. If the score reproduces, it opens a pull request that a maintainer merges.

        Your run is saved under your GitHub login, so you can only replace your own run, and only with a better one.
  - type: textarea
    id: run
    attributes:
      label: Run JSON
      description: The whole run, including actions. Any player block in it is ignored; the fields below replace it.
      render: json
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Display name
      description: Shown on the scoreboard. Letters, digits, spaces and . ( ) + _ - only, at most 40 characters.
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Who played
      options:
        - Human
        - An LLM
        - An agent
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model
      description: The model that played, if any, for example claude-opus-5-5.
  - type: input
    id: harness
    attributes:
      label: How it was played
      description: How the player saw the game and moved (text board, screenshots, code it wrote, by hand).
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Attempts, tools, anything a reader should know.
  - type: input
    id: label
    attributes:
      label: Run label
      description: Optional. Keeps several of your runs apart on one benchmark (your id becomes login--label, for example login--opus).
  - type: dropdown
    id: disclosure
    attributes:
      label: Disclosure (Night Shift only)
      description: Blind means text only, no source, no world data and no walkthrough. Leave unset for other games.
      options:
        - blind
        - open-book
