                const pushAx = a.x - nx * overlap * weightA;
                const pushAy = a.y - ny * overlap * weightA;
                if (!carCollidesWithWorld(pushAx, pushAy, a.angle)) {
                  a.x = pushAx;
                  a.y = pushAy;
                }

                const pushBx = b.x + nx * overlap * weightB;
                const pushBy = b.y + ny * overlap * weightB;
                if (!carCollidesWithWorld(pushBx, pushBy, b.angle)) {
                  b.x = pushBx;
                  b.y = pushBy;
                }
              }
            }
          }

          if (collided) {
            const relSpeed = Math.abs(a.speed) + Math.abs(b.speed);
            if (a === player.inCar || b === player.inCar) {
              if (relSpeed > 130 && collisionSoundCooldown <= 0) {
                const isCopHit = a.isPolice || b.isPolice;
                const dmg = Math.round((relSpeed - 100) * (isCopHit ? 0.09 : 0.06));
                if (dmg > 0) damagePlayerCar(dmg);
                playThud(Math.min(1, relSpeed / 350));
                collisionSoundCooldown = 0.28;
              }
            }

            if (a.isPolice && b.isTraffic) {
              a.speed *= 0.85;
              b.speed *= 0.2;
            } else if (b.isPolice && a.isTraffic) {
              b.speed *= 0.85;
              a.speed *= 0.2;
            } else {
              a.speed *= 0.35;
              b.speed *= 0.35;
            }
            if (a.isTraffic) snapTrafficToNearestRoad(a);
            if (b.isTraffic) snapTrafficToNearestRoad(b);
          }
        }
      }
    }
  }

  const CARDINAL_DIRS = [
    { dx: 1, dy: 0, angle: 0 },
    { dx: 0, dy: 1, angle: Math.PI * 0.5 },
    { dx: -1, dy: 0, angle: Math.PI },
    { dx: 0, dy: -1, angle: -Math.PI * 0.5 }
  ];

  function isIntersectionTile(tx, ty) {
    const horiz = getTile(tx - 1, ty) === TILE.ROAD || getTile(tx + 1, ty) === TILE.ROAD;
    const vert = getTile(tx, ty - 1) === TILE.ROAD || getTile(tx, ty + 1) === TILE.ROAD;
    return horiz && vert;
  }

  function updateTrafficCar(car, dt) {
    const prevX = car.x;
    const prevY = car.y;

    snapTrafficToNearestRoad(car);

    if (car.reverseTimer > 0) {
      car.reverseTimer -= dt;
      car.speed = -120;
      const rvx = Math.cos(car.angle) * car.speed * dt;
      const rvy = Math.sin(car.angle) * car.speed * dt;
      if (!carCollidesWithWorld(car.x + rvx, car.y + rvy, car.angle)) {
        car.x += rvx;
        car.y += rvy;
      }
      if (car.reverseTimer <= 0) {
        car.angle += (Math.PI * 0.5) * car.turnDir;
        car.forceTurn = true;
        car.lastTileX = -1;
        car.lastTileY = -1;
        car.speed = 90;
      }
      return;
    }

    const fwdX = Math.cos(car.angle);
    const fwdY = Math.sin(car.angle);
    const rightX = -fwdY;
    const rightY = fwdX;

    const tx = Math.floor(car.x / TILE_SIZE);
    const ty = Math.floor(car.y / TILE_SIZE);
    const inIntersection = isIntersectionTile(tx, ty);

    let policeNearby = false;
    if (wantedLevel > 0) {
      for (const cop of police) {
        if (Math.hypot(cop.x - car.x, cop.y - car.y) < 220) {
          policeNearby = true;
          break;
        }
      }
    }

    let minAheadDist = Infinity;
    const allVehicles = cars.concat(police);
    for (const other of allVehicles) {
      if (other === car) continue;
      const dx = other.x - car.x;
      const dy = other.y - car.y;
      const forwardDist = dx * fwdX + dy * fwdY;
      const sideDist = Math.abs(dx * rightX + dy * rightY);
      if (forwardDist > 10 && forwardDist < 160 && sideDist < 38) {
        if (forwardDist < minAheadDist) {
          minAheadDist = forwardDist;
        }
      }
    }

    const blockedAhead = minAheadDist < 118;
    if (blockedAhead) {
      car.blockedTimer += dt;
      if (car.blockedTimer >= 2.0) {
        car.forceTurn = true;
      }
    } else {
      car.blockedTimer = 0;
    }

    if (policeNearby && !inIntersection) {
      car.speed = Math.max(0, car.speed - 420 * dt);
      const sideShiftX = car.x + rightX * 14 * dt;
      const sideShiftY = car.y + rightY * 14 * dt;
      if (
        getTile(Math.floor(sideShiftX / TILE_SIZE), Math.floor(sideShiftY / TILE_SIZE)) === TILE.ROAD &&
        !carCollidesWithWorld(sideShiftX, sideShiftY, car.angle)
      ) {
        car.x = sideShiftX;
        car.y = sideShiftY;
      }
    } else if (blockedAhead) {
      car.speed = Math.max(0, car.speed - 520 * dt);
    } else if (minAheadDist < 160) {
      const target = car.trafficSpeed * 0.35;
      car.speed += (target - car.speed) * Math.min(1, 5 * dt);
    } else if (policeNearby && inIntersection) {
      const target = car.trafficSpeed * 0.65;
      car.speed += (target - car.speed) * Math.min(1, 4 * dt);
    } else {
      car.speed += (car.trafficSpeed - car.speed) * Math.min(1, 4 * dt);
    }

    const curIdx = getNearestCardinalIndex(car.angle);
    if (tx !== car.lastTileX || ty !== car.lastTileY || (car.forceTurn && inIntersection)) {
      car.lastTileX = tx;
      car.lastTileY = ty;

      const oppositeIdx = (curIdx + 2) % 4;
      const validDirs = [];
      for (let i = 0; i < 4; i++) {
        if (i === oppositeIdx) continue;
        const d = CARDINAL_DIRS[i];
        if (getTile(tx + d.dx, ty + d.dy) === TILE.ROAD) {
          validDirs.push(i);
        }
      }

      if (validDirs.length === 0) {
        car.angle = CARDINAL_DIRS[oppositeIdx].angle;
        car.forceTurn = false;
      } else if (car.forceTurn) {
        const turns = validDirs.filter(i => i !== curIdx);
        const pool = turns.length > 0 ? turns : validDirs;
        const pick = pool[Math.floor(Arcade.random() * pool.length)];
        car.angle = CARDINAL_DIRS[pick].angle;
        car.x = (tx + 0.5) * TILE_SIZE;
        car.y = (ty + 0.5) * TILE_SIZE;
        car.forceTurn = false;
        car.blockedTimer = 0;
      } else if (!validDirs.includes(curIdx)) {
        const pick = validDirs[Math.floor(Arcade.random() * validDirs.length)];
        car.angle = CARDINAL_DIRS[pick].angle;
        car.x = (tx + 0.5) * TILE_SIZE;
        car.y = (ty + 0.5) * TILE_SIZE;
      } else if (validDirs.length > 1 && Arcade.random() < 0.32) {
        const turns = validDirs.filter(i => i !== curIdx);
        const pick = turns[Math.floor(Arcade.random() * turns.length)];
        car.angle = CARDINAL_DIRS[pick].angle;
        car.x = (tx + 0.5) * TILE_SIZE;
        car.y = (ty + 0.5) * TILE_SIZE;
      }
    }

    const moveX = Math.cos(car.angle) * car.speed * dt;
    const moveY = Math.sin(car.angle) * car.speed * dt;
    const nx = car.x + moveX;
    const ny = car.y + moveY;

    const frontTx = Math.floor((nx + Math.cos(car.angle) * 26) / TILE_SIZE);
    const frontTy = Math.floor((ny + Math.sin(car.angle) * 26) / TILE_SIZE);
    const centerTx = Math.floor(nx / TILE_SIZE);
    const centerTy = Math.floor(ny / TILE_SIZE);

    if (
      getTile(centerTx, centerTy) === TILE.ROAD &&
      getTile(frontTx, frontTy) === TILE.ROAD &&
      !carCollidesWithWorld(nx, ny, car.angle)
    ) {
      car.x = nx;
      car.y = ny;
      if (!policeNearby) {
        if (Math.abs(Math.cos(car.angle)) > 0.5) {
          car.y += ((ty + 0.5) * TILE_SIZE - car.y) * Math.min(1, 5 * dt);
        } else {
          car.x += ((tx + 0.5) * TILE_SIZE - car.x) * Math.min(1, 5 * dt);
        }
      }
    } else if (car.speed > 5) {
      car.angle += Math.PI;
      car.speed = 35;
      snapTrafficToNearestRoad(car);
    }

    const movedDist = Math.hypot(car.x - prevX, car.y - prevY);
    if (!policeNearby && (Math.abs(car.speed) < 18 || movedDist < 15 * dt)) {
      car.stuckTimer += dt;
      car.totalStuckTimer += dt;
      if (car.totalStuckTimer >= 8.0) {
        respawnTrafficCar(car);
        return;
      } else if (car.stuckTimer >= 3.0) {
        car.stuckTimer = 0;
        car.reverseTimer = 0.5;
        car.turnDir = Arcade.random() < 0.5 ? 1 : -1;
      }
    } else if (movedDist >= 25 * dt) {
      car.stuckTimer = 0;
      car.totalStuckTimer = Math.max(0, car.totalStuckTimer - dt * 2);
    }

    if (!player.inCar && Math.abs(car.speed) > 45) {
      const dist = Math.hypot(player.x - car.x, player.y - car.y);
      if (dist < 36) {
        damagePlayerOnFoot(car.x, car.y);
      }
    }
  }

  function updatePlayerCar(car, dt) {
    const curTile = getTile(Math.floor(car.x / TILE_SIZE), Math.floor(car.y / TILE_SIZE));
    const onGrass = curTile === TILE.PARK;
    const maxAllowedSpeed = onGrass ? car.maxSpeed * 0.65 : car.maxSpeed;
    const accel = onGrass ? 280 : 380;
    const brakeForce = 520;
    const handbrakeForce = 760;
    const friction = onGrass ? 240 : 160;

    if (dustTimer > 0) dustTimer = Math.max(0, dustTimer - dt);

    if (keys['Space']) {
      if (car.speed > 0) car.speed = Math.max(0, car.speed - handbrakeForce * dt);
      else if (car.speed < 0) car.speed = Math.min(0, car.speed + handbrakeForce * dt);
    } else if (keys['KeyW']) {
      if (car.speed < maxAllowedSpeed) {
        car.speed = Math.min(maxAllowedSpeed, car.speed + accel * dt);
        // Dust puff when accelerating fast
        if (car.speed > 45 && dustTimer <= 0) {
          dustTimer = 0.065;
          const backX = car.x - Math.cos(car.angle) * (CAR_LENGTH * 0.52);
          const backY = car.y - Math.sin(car.angle) * (CAR_LENGTH * 0.52);
          const spread = (Math.random() - 0.5) * 14;
          const perpX = -Math.sin(car.angle) * spread;
          const perpY = Math.cos(car.angle) * spread;
          spawnDustPuff(
            backX + perpX,
            backY + perpY,
            -Math.cos(car.angle) * 35 + (Math.random() - 0.5) * 18,
            -Math.sin(car.angle) * 35 + (Math.random() - 0.5) * 18
          );
        }
      } else {
        car.speed = Math.max(maxAllowedSpeed, car.speed - 260 * dt);
      }
    } else if (keys['KeyS']) {
      if (car.speed > 0) {
        car.speed = Math.max(0, car.speed - brakeForce * dt);
      } else {
        car.speed = Math.max(car.reverseSpeed, car.speed - accel * 0.7 * dt);
      }
    } else {
      if (car.speed > 0) car.speed = Math.max(0, car.speed - friction * dt);
      else if (car.speed < 0) car.speed = Math.min(0, car.speed + friction * dt);
    }

    if (Math.abs(car.speed) > 8) {
      const steerDir = car.speed >= 0 ? 1 : -1;
      const turnRate = (keys['Space'] ? 3.8 : 2.8) * Math.min(1, Math.abs(car.speed) / 120);
      let nextAngle = car.angle;
      if (keys['KeyA']) nextAngle -= turnRate * steerDir * dt;
      if (keys['KeyD']) nextAngle += turnRate * steerDir * dt;
      if (!carCollidesWithWorld(car.x, car.y, nextAngle)) {
        car.angle = nextAngle;
      }
    }

    const vx = Math.cos(car.angle) * car.speed * dt;
    const vy = Math.sin(car.angle) * car.speed * dt;

    if (!carCollidesWithWorld(car.x + vx, car.y + vy, car.angle)) {
      car.x += vx;
      car.y += vy;
    } else {
      let moved = false;
      if (!carCollidesWithWorld(car.x + vx, car.y, car.angle)) {
        car.x += vx;
        moved = true;
      } else if (!carCollidesWithWorld(car.x, car.y + vy, car.angle)) {
        car.y += vy;
        moved = true;
      }
      const impactSpeed = Math.abs(car.speed);
      if (impactSpeed > 130 && collisionSoundCooldown <= 0) {
        const dmg = Math.round((impactSpeed - 110) * 0.08);
        if (dmg > 0) damagePlayerCar(dmg);
        playThud(Math.min(1, impactSpeed / 360));
        collisionSoundCooldown = 0.25;
      } else if (impactSpeed > 60 && collisionSoundCooldown <= 0) {
        playThud(Math.min(1, impactSpeed / 360));
        collisionSoundCooldown = 0.22;
      }
      car.speed = moved ? car.speed * 0.6 : -car.speed * 0.25;
    }
  }

  function checkNearMisses(dt) {
    for (const car of cars) {
      if (car.nearMissCooldown > 0) {
        car.nearMissCooldown = Math.max(0, car.nearMissCooldown - dt);
      }
    }
    if (!player.inCar) return;
    const pCar = player.inCar;
    if (Math.abs(pCar.speed) < 220) return;

    for (const car of cars) {
      if (car === pCar || !car.isTraffic || car.nearMissCooldown > 0) continue;
      const dist = Math.hypot(car.x - pCar.x, car.y - pCar.y);
      if (dist > 44 && dist < 82) {
        car.nearMissCooldown = 3.0;
        addScore(100, pCar.x, pCar.y - 24, '#4cd964');
      }
    }
  }

  function updateCars(dt) {
    if (collisionSoundCooldown > 0) {
      collisionSoundCooldown = Math.max(0, collisionSoundCooldown - dt);
    }

    for (const car of cars) {
      if (car.wrecked) continue;
      if (car === player.inCar) {
        updatePlayerCar(car, dt);
      } else if (car.isTraffic) {
        updateTrafficCar(car, dt);
      } else {
        if (Math.abs(car.speed) > 1) {
          car.speed *= Math.max(0, 1 - 6 * dt);
          const nx = car.x + Math.cos(car.angle) * car.speed * dt;
          const ny = car.y + Math.sin(car.angle) * car.speed * dt;
          if (!carCollidesWithWorld(nx, ny, car.angle)) {
            car.x = nx;
            car.y = ny;
          } else {
            car.speed = 0;
          }
        } else {
          car.speed = 0;
        }
      }
    }
    resolveAllVehicleCollisions();
    checkNearMisses(dt);
  }

  // ---- Car sprites: baked once per colour/variant, then rotated -----------
  const CAR_SPR_PAD = 6;
  const carSpriteCache = new Map();

  function carVariantFor(color) {
    const i = CAR_COLORS.indexOf(color);
    return i < 0 ? 0 : (i % 3);
  }

  function buildCarSprite(color, variant, kind) {
    const hl = CAR_LENGTH * 0.5;
    const hw = CAR_WIDTH * 0.5;
    const P = CAR_SPR_PAD;
    const c = makeCanvas(CAR_LENGTH + P * 2, CAR_WIDTH + P * 2);
    const g = c.getContext('2d');
    g.translate(c.width / 2, c.height / 2);
    const isPolice = kind === 'police';
    const wreck = kind === 'wreck';
    const base = wreck ? '#2e2a28' : (isPolice ? '#16181d' : color);

    // tyres peeking out under the body
    g.fillStyle = '#0c0d0f';
    for (const tx of [hl - 20, -hl + 13]) {
      roundRectPath(g, tx - 7, -hw - 0.5, 14, 5, 1.5); g.fill();
      roundRectPath(g, tx - 7, hw - 4.5, 14, 5, 1.5); g.fill();
    }

    // body with a rounded cross-section
    const bg = g.createLinearGradient(0, -hw, 0, hw);
    bg.addColorStop(0, shade(base, -0.42));
    bg.addColorStop(0.16, shade(base, -0.06));
    bg.addColorStop(0.45, shade(base, 0.14));
    bg.addColorStop(0.55, shade(base, 0.14));
    bg.addColorStop(0.84, shade(base, -0.06));
    bg.addColorStop(1, shade(base, -0.42));
    roundRectPath(g, -hl, -hw + 1, CAR_LENGTH, CAR_WIDTH - 2, 8);
    g.fillStyle = bg;
    g.fill();

    if (isPolice) {
      // white door section (black / white paint)
      g.save();
      roundRectPath(g, -hl, -hw + 1, CAR_LENGTH, CAR_WIDTH - 2, 8);
      g.clip();
      const wg = g.createLinearGradient(0, -hw, 0, hw);
      wg.addColorStop(0, '#9fa4ab');
      wg.addColorStop(0.2, '#eef0f4');
      wg.addColorStop(0.5, '#ffffff');
      wg.addColorStop(0.8, '#eef0f4');
      wg.addColorStop(1, '#9fa4ab');
      g.fillStyle = wg;
      g.fillRect(-16, -hw, 32, CAR_WIDTH);
      g.fillStyle = '#2050b8';
      g.fillRect(-16, -hw + 1, 32, 2.5);
      g.fillRect(-16, hw - 3.5, 32, 2.5);
      g.restore();
    }

    roundRectPath(g, -hl, -hw + 1, CAR_LENGTH, CAR_WIDTH - 2, 8);
    g.lineWidth = 1.5;
    g.strokeStyle = 'rgba(0,0,0,0.6)';
    g.stroke();

    // geometry per variant: windshield [front edge], roof [x0,x1], rear window back edge
    let ws0, ws1, roof0, roof1, rw0;
    if (variant === 1) { ws0 = 6; ws1 = 16; roof0 = -20; roof1 = 6; rw0 = -28; }
    else if (variant === 2) { ws0 = 8; ws1 = 17; roof0 = -4; roof1 = 8; rw0 = -8; }
    else { ws0 = 4; ws1 = 15; roof0 = -14; roof1 = 4; rw0 = -22; }
    const rhw = hw - 5;

    // hood creases
    g.strokeStyle = 'rgba(0,0,0,0.14)';
    g.lineWidth = 1;
    g.beginPath();
    g.moveTo(ws1 + 3, -7); g.lineTo(hl - 4, -6);
    g.moveTo(ws1 + 3, 7); g.lineTo(hl - 4, 6);
    g.stroke();
    g.strokeStyle = 'rgba(255,255,255,0.12)';
    g.beginPath();
    g.moveTo(ws1 + 3, -6); g.lineTo(hl - 4, -5);
    g.stroke();

    if (variant === 2 && !isPolice) {
      // pickup bed
      g.fillStyle = shade(base, -0.35);
      g.fillRect(-hl + 3, -hw + 4, (-11) - (-hl + 3), CAR_WIDTH - 8);
      g.fillStyle = 'rgba(0,0,0,0.25)';
      for (let bx = -hl + 7; bx < -12; bx += 5) g.fillRect(bx, -hw + 5, 1.5, CAR_WIDTH - 10);
      g.strokeStyle = shade(base, -0.1);
      g.lineWidth = 1.5;
      g.strokeRect(-hl + 3, -hw + 4, (-11) - (-hl + 3), CAR_WIDTH - 8);
    } else {
      g.strokeStyle = 'rgba(0,0,0,0.18)';
      g.lineWidth = 1;
      g.beginPath();
      g.moveTo(rw0 - 2, -hw + 5); g.lineTo(rw0 - 2, hw - 5);
      g.stroke();
    }

    const glass = g.createLinearGradient(0, -hw, 0, hw);
    if (wreck) {
      glass.addColorStop(0, '#0b0b0c');
      glass.addColorStop(1, '#151517');
    } else {
      glass.addColorStop(0, '#141d27');
      glass.addColorStop(0.5, '#3a5670');
      glass.addColorStop(1, '#141d27');
    }
    g.fillStyle = glass;
    // windshield
    g.beginPath();
    g.moveTo(roof1, -rhw); g.lineTo(ws1, -hw + 3); g.lineTo(ws1, hw - 3); g.lineTo(roof1, rhw);
    g.closePath();
    g.fill();
    // rear window
    g.beginPath();
    g.moveTo(roof0, -rhw); g.lineTo(rw0, -hw + 4); g.lineTo(rw0, hw - 4); g.lineTo(roof0, rhw);
    g.closePath();
    g.fill();
    // side windows
    g.fillRect(roof0 + 1, -hw + 2.5, roof1 - roof0 - 2, 2.5);
    g.fillRect(roof0 + 1, rhw, roof1 - roof0 - 2, 2.5);

    // roof
    const roofCol = isPolice ? '#f4f6fa' : (wreck ? '#262220' : shade(base, 0.06));
    const rgd = g.createLinearGradient(0, -rhw, 0, rhw);
    rgd.addColorStop(0, isPolice ? '#d8dce2' : shade(base, -0.12));
    rgd.addColorStop(0.4, roofCol);
    rgd.addColorStop(1, isPolice ? '#c9ced6' : shade(base, -0.18));
    roundRectPath(g, roof0, -rhw, roof1 - roof0, rhw * 2, 3);
    g.fillStyle = rgd;
    g.fill();
    g.strokeStyle = 'rgba(0,0,0,0.3)';
    g.lineWidth = 1;
    g.stroke();
    g.fillStyle = 'rgba(255,255,255,0.22)';
    g.fillRect(roof0 + 2, -rhw + 1.5, roof1 - roof0 - 4, 1.5);

    if (!wreck) {
      // glass reflections
      g.strokeStyle = 'rgba(255,255,255,0.28)';
      g.lineWidth = 1.5;
      g.beginPath();
      g.moveTo(roof1 + 2, -rhw + 3); g.lineTo(ws1 - 2, -rhw + 8);
      g.moveTo(roof0 - 2, rhw - 3); g.lineTo(rw0 + 2, rhw - 7);
      g.stroke();
    } else {
      // cracked glass + scorch
      g.strokeStyle = 'rgba(160,160,160,0.35)';
      g.lineWidth = 0.8;
      g.beginPath();
      g.moveTo(roof1 + 1, -4); g.lineTo(ws1 - 1, 3); g.moveTo(roof1 + 3, 6); g.lineTo(ws1 - 2, -6);
      g.stroke();
      const rnd = mulberry32(77);
      for (let i = 0; i < 9; i++) {
        g.fillStyle = rnd() < 0.3 ? 'rgba(140,60,20,0.35)' : 'rgba(0,0,0,0.4)';
        fillEllipse(g, -hl + rnd() * CAR_LENGTH, -hw + 4 + rnd() * (CAR_WIDTH - 8), 3 + rnd() * 6, 2 + rnd() * 4);
      }
    }

    // mirrors
    g.fillStyle = shade(isPolice ? '#16181d' : base, -0.2);
    g.fillRect(ws0 + 1, -hw - 1, 4, 3);
    g.fillRect(ws0 + 1, hw - 2, 4, 3);

    // unlit lamps
    g.fillStyle = wreck ? '#3a3533' : '#cfc8a0';
    g.fillRect(hl - 4, -hw + 4, 3.5, 7);
    g.fillRect(hl - 4, hw - 11, 3.5, 7);
    g.fillStyle = wreck ? '#2a1d1b' : '#701414';
    g.fillRect(-hl + 0.5, -hw + 4, 3, 7);
    g.fillRect(-hl + 0.5, hw - 11, 3, 7);

    if (isPolice) {
      g.fillStyle = '#0a0a0b';
      g.fillRect(hl - 1, -11, 2.5, 22);
      g.fillStyle = '#1e2126';
      roundRectPath(g, -5.5, -rhw + 0.5, 11, rhw * 2 - 1, 2);
      g.fill();
    }
    return c;
  }

  function getCarSprite(color, variant, kind) {
    const key = kind + '|' + color + '|' + variant;
    let spr = carSpriteCache.get(key);
    if (!spr) {
      spr = buildCarSprite(color, variant, kind);
      carSpriteCache.set(key, spr);
    }
    return spr;
  }

  const carShadowSprite = (() => {
    const pad = 10;
    const c = makeCanvas(CAR_LENGTH + pad * 2, CAR_WIDTH + pad * 2);
    const g = c.getContext('2d');
    g.translate(c.width / 2, c.height / 2);
    g.fillStyle = 'rgba(0,0,0,0.11)';
    for (let i = 0; i < 6; i++) {
      roundRectPath(g, -CAR_LENGTH * 0.5 - 4 + i * 1.6, -CAR_WIDTH * 0.5 - 4 + i * 1.6,
        CAR_LENGTH + 8 - i * 3.2, CAR_WIDTH + 8 - i * 3.2, 10);
      g.fill();
    }
    return c;
  })();

  function inView(sx, sy, m) {
    const vw = canvas.width / CAMERA_ZOOM;
    const vh = canvas.height / CAMERA_ZOOM;
    return sx > -m && sy > -m && sx < vw + m && sy < vh + m;
  }

  function drawVehicleShadows(camX, camY) {
    const sw = carShadowSprite.width;
    const sh = carShadowSprite.height;
    const draw = (v) => {
      const sx = v.x - camX;
      const sy = v.y - camY;
      if (!inView(sx, sy, 90)) return;
      ctx.save();
      ctx.translate(sx + 5, sy + 7);
      ctx.rotate(v.angle);
      ctx.drawImage(carShadowSprite, -sw * 0.5, -sh * 0.5);
      ctx.restore();
    };
    for (const car of cars) draw(car);
    for (const cop of police) draw(cop);
  }

  function localToWorld(v, lx, ly) {
    const cos = Math.cos(v.angle);
    const sin = Math.sin(v.angle);
    return [v.x + lx * cos - ly * sin, v.y + lx * sin + ly * cos];
  }

  // Lamps for a live vehicle (called inside its rotated transform)
  function drawCarLamps(v, headlightsOn) {
    const hl = CAR_LENGTH * 0.5;
    const hw = CAR_WIDTH * 0.5;
    const s = vstate(v);
    const braking = s.brake > 0;
    const reversing = v === player.inCar && v.speed < -5;

    if (headlightsOn) {
      ctx.fillStyle = '#fff8d2';
      ctx.fillRect(hl - 4, -hw + 4, 3.5, 7);
      ctx.fillRect(hl - 4, hw - 11, 3.5, 7);
      for (const ly of [-hw + 7.5, hw - 7.5]) {
        const p = localToWorld(v, hl + 2, ly);
        queueGlow(SPR_GLOW_WARM, p[0], p[1], 22, 0.45);
      }
    }
    ctx.fillStyle = braking ? '#ff2a1c' : (headlightsOn ? '#b32118' : '#701414');
    ctx.fillRect(-hl + 0.5, -hw + 4, 3, 7);
    ctx.fillRect(-hl + 0.5, hw - 11, 3, 7);
    if (reversing) {
      ctx.fillStyle = '#f4f4f4';
      ctx.fillRect(-hl + 0.5, -hw + 9, 3, 2);
      ctx.fillRect(-hl + 0.5, hw - 11, 3, 2);
    }
    if (braking) {
      for (const ly of [-hw + 7.5, hw - 7.5]) {
        const p = localToWorld(v, -hl - 1, ly);
        queueGlow(SPR_GLOW_RED, p[0], p[1], 34, 0.85);
      }
    }
  }

  function drawCars(camX, camY) {
    for (const car of cars) {
      const sx = car.x - camX;
      const sy = car.y - camY;
      if (!inView(sx, sy, 90)) continue;

      const spr = car.wrecked
        ? getCarSprite('#2b2b2b', carVariantFor(car.color), 'wreck')
        : getCarSprite(car.color, carVariantFor(car.color), 'civ');

      ctx.save();
      ctx.translate(sx, sy);
      ctx.rotate(car.angle);
      ctx.drawImage(spr, -spr.width * 0.5, -spr.height * 0.5);
      if (!car.wrecked) {
        const lightsOn = car.isTraffic || car === player.inCar;
        drawCarLamps(car, lightsOn);
        if (car === player.inCar && car.health < 100) {
          // dents / scuffs show damage
          const dmg = 1 - car.health / 100;
          ctx.fillStyle = `rgba(0,0,0,${(dmg * 0.35).toFixed(3)})`;
          fillEllipse(ctx, 26, -10, 6 * dmg + 1, 4 * dmg + 1);
          fillEllipse(ctx, -28, 9, 5 * dmg + 1, 4 * dmg + 1);
          fillEllipse(ctx, 4, 15, 7 * dmg + 1, 2 * dmg + 1);
        }
      }
      ctx.restore();

      if (car.wrecked) {
        const flick = 0.5 + 0.5 * Math.sin(visualTime * 17 + car.x);
        const age = vstate(car).wreckAge;
        if (age < 6) queueGlow(SPR_FIRE, car.x + 6, car.y - 2, 40 + flick * 14, (1 - age / 6) * 0.9);
      }
    }
  }

  // =========================================================================
  // PEDS
  // =========================================================================
  const PED_COLORS = ['#3b82f6', '#10b981', '#f59e0b', '#a855f7', '#ec4899', '#14b8a6', '#f97316'];
  const peds = [];

  function spawnPeds() {
    const sidewalkTiles = [];
    for (let y = 3; y < 53; y++) {
      for (let x = 3; x < 54; x++) {
        if (getTile(x, y) === TILE.SIDEWALK) {
          sidewalkTiles.push({ tx: x, ty: y });
        }
      }
    }

    for (let i = 0; i < 25; i++) {
      const pick = sidewalkTiles[Math.floor(Arcade.random() * sidewalkTiles.length)];
      const dir = CARDINAL_DIRS[Math.floor(Arcade.random() * 4)];
      peds.push({
        x: (pick.tx + 0.5) * TILE_SIZE,
        y: (pick.ty + 0.5) * TILE_SIZE,
        dx: dir.dx,
        dy: dir.dy,
        walkSpeed: 55 + Arcade.random() * 25,
        fleeSpeed: 145,
        color: PED_COLORS[i % PED_COLORS.length],
        pauseTimer: Arcade.random() * 1.5,
        fleeTimer: 0,
        fleeScoreCooldown: 0,
        lastTileX: pick.tx,
        lastTileY: pick.ty
      });
    }
  }

  spawnPeds();

  function updatePeds(dt) {
    for (const ped of peds) {
      if (ped.fleeScoreCooldown > 0) {
        ped.fleeScoreCooldown = Math.max(0, ped.fleeScoreCooldown - dt);
      }

      let threatX = null;
      let threatY = null;
      let playerCausedThreat = false;

      if (!player.inCar && player.attackTimer > 0) {
        const distP = Math.hypot(ped.x - player.x, ped.y - player.y);
        if (distP < 120) {
          threatX = player.x;
          threatY = player.y;
          playerCausedThreat = true;
        }
      }

      for (const car of cars) {
        if (Math.abs(car.speed) < 120) continue;
        const dx = ped.x - car.x;
        const dy = ped.y - car.y;
        const dist = Math.hypot(dx, dy);
        if (dist < 135) {
          const fwdX = Math.cos(car.angle) * Math.sign(car.speed);
          const fwdY = Math.sin(car.angle) * Math.sign(car.speed);
          const dot = (dx * fwdX + dy * fwdY) / (dist || 1);
          if (dot > 0.2 || dist < 65) {
            threatX = car.x;
            threatY = car.y;
            if (car === player.inCar) playerCausedThreat = true;
            break;
          }
        }
      }

      if (threatX !== null) {
        if (ped.fleeTimer <= 0 && playerCausedThreat && ped.fleeScoreCooldown <= 0) {
          addScore(50, ped.x, ped.y - 16, '#ffcc00');
          ped.fleeScoreCooldown = 4.0;
        }
        ped.fleeTimer = 2.6;
        const awayX = ped.x - threatX;
        const awayY = ped.y - threatY;
        const len = Math.hypot(awayX, awayY) || 1;
        ped.dx = awayX / len;
        ped.dy = awayY / len;
      }

      if (ped.fleeTimer > 0) {
        ped.fleeTimer -= dt;
        const curTx = Math.floor(ped.x / TILE_SIZE);
        const curTy = Math.floor(ped.y / TILE_SIZE);

        if (getTile(curTx, curTy) !== TILE.SIDEWALK) {
          const nearest = findNearestTileOfType(ped.x, ped.y, TILE.SIDEWALK);
          const sx = nearest.x - ped.x;
          const sy = nearest.y - ped.y;
          const slen = Math.hypot(sx, sy) || 1;
          ped.dx = sx / slen;
          ped.dy = sy / slen;
        }

        const nx = ped.x + ped.dx * ped.fleeSpeed * dt;
        const ny = ped.y + ped.dy * ped.fleeSpeed * dt;
        const ntx = Math.floor(nx / TILE_SIZE);
        const nty = Math.floor(ny / TILE_SIZE);

        if (getTile(ntx, nty) === TILE.SIDEWALK) {
          ped.x = nx;
          ped.y = ny;
        } else {
          if (getTile(Math.floor(nx / TILE_SIZE), curTy) === TILE.SIDEWALK) {
            ped.x = nx;
          } else if (getTile(curTx, Math.floor(ny / TILE_SIZE)) === TILE.SIDEWALK) {
            ped.y = ny;
          } else {
            const nearest = findNearestTileOfType(ped.x, ped.y, TILE.SIDEWALK);
            ped.x += (nearest.x - ped.x) * Math.min(1, 5 * dt);
            ped.y += (nearest.y - ped.y) * Math.min(1, 5 * dt);
          }
        }
        continue;
      }

      if (ped.pauseTimer > 0) {
        ped.pauseTimer -= dt;
        continue;
      }

      const tx = Math.floor(ped.x / TILE_SIZE);
      const ty = Math.floor(ped.y / TILE_SIZE);

      if (getTile(tx, ty) !== TILE.SIDEWALK) {
        const nearest = findNearestTileOfType(ped.x, ped.y, TILE.SIDEWALK);
        ped.x = nearest.x;
        ped.y = nearest.y;
        ped.lastTileX = nearest.tx;
        ped.lastTileY = nearest.ty;
      }

      if (tx !== ped.lastTileX || ty !== ped.lastTileY) {
        ped.lastTileX = tx;
        ped.lastTileY = ty;

        if (Arcade.random() < 0.2) {
          ped.pauseTimer = 0.6 + Arcade.random() * 1.4;
        }

        const validDirs = [];
        for (const d of CARDINAL_DIRS) {
          if (getTile(tx + d.dx, ty + d.dy) === TILE.SIDEWALK) {
            validDirs.push(d);
          }
        }

        if (validDirs.length > 0) {
          const forwardValid = validDirs.find(d => d.dx === Math.round(ped.dx) && d.dy === Math.round(ped.dy));
          if (!forwardValid || (validDirs.length > 2 && Arcade.random() < 0.35)) {
            const nonReverse = validDirs.filter(d => !(d.dx === -Math.round(ped.dx) && d.dy === -Math.round(ped.dy)));
            const pool = nonReverse.length > 0 ? nonReverse : validDirs;
            const pick = pool[Math.floor(Arcade.random() * pool.length)];
            ped.dx = pick.dx;
            ped.dy = pick.dy;
          }
        }
      }

      const nx = ped.x + ped.dx * ped.walkSpeed * dt;
      const ny = ped.y + ped.dy * ped.walkSpeed * dt;
      const frontTx = Math.floor((nx + ped.dx * 10) / TILE_SIZE);
      const frontTy = Math.floor((ny + ped.dy * 10) / TILE_SIZE);

      if (getTile(frontTx, frontTy) === TILE.SIDEWALK) {
        ped.x = nx;
        ped.y = ny;
      } else {
        const validDirs = CARDINAL_DIRS.filter(d => getTile(tx + d.dx, ty + d.dy) === TILE.SIDEWALK);
        if (validDirs.length > 0) {
          const pick = validDirs[Math.floor(Arcade.random() * validDirs.length)];
          ped.dx = pick.dx;
          ped.dy = pick.dy;
        }
      }
    }
  }

  const PED_SKINS = ['#f2c8a2', '#e0ac7e', '#c68a5c', '#8d5a3b', '#f6d5b8', '#a8714b'];
  const PED_HAIR = ['#2a1d14', '#4a2f1b', '#121212', '#7a5a32', '#b88a4a', '#5a5a5a', '#8b3a1e'];
  const PED_PANTS = ['#2a3443', '#3d3d45', '#4a3b2a', '#1f2b3a', '#5a5f6a', '#30402e'];

  function drawPeds(camX, camY) {
    for (const ped of peds) {
      const sx = ped.x - camX;
      const sy = ped.y - camY;
      if (!inView(sx, sy, 40)) continue;
      const s = vstate(ped);
      const look = s.look;
      const fleeing = ped.fleeTimer > 0;
      drawCharacter(sx, sy, Math.atan2(ped.dy, ped.dx), {
        shirt: ped.color,
        shirtDark: shade(ped.color, -0.2),
        pants: PED_PANTS[look % PED_PANTS.length],
        skin: PED_SKINS[(look >> 3) % PED_SKINS.length],
        hair: PED_HAIR[(look >> 5) % PED_HAIR.length],
        scale: 0.74,
        phase: s.phase,
        moving: (ped.pauseTimer > 0 && !fleeing) ? 0 : s.moving,
        flee: fleeing
      });

      if (fleeing) {
        // "!" alert bubble
        const by = sy - 22 + Math.sin(visualTime * 14 + look) * 1.5;
        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        fillCircle(ctx, sx + 1, by + 1, 7);
        ctx.fillStyle = '#ffeb3b';
        fillCircle(ctx, sx, by, 7);
        ctx.fillStyle = '#1a1a1a';
        ctx.fillRect(sx - 1.4, by - 4.5, 2.8, 5.5);
        ctx.fillRect(sx - 1.4, by + 2.2, 2.8, 2.4);
      }
    }
  }

  // =========================================================================
  // POLICE
  // =========================================================================
  const WANTED_THRESHOLDS = [0, 200, 500, 1000, 2000, 3500];
  let wantedLevel = 0;
  let noMayhemTimer = 0;
  let bustedTimer = 0;
  let sirenFlashTime = 0;
  let policeSeePlayerNow = false;

  const police = [];
  const policeOfficers = [];

  const EDGE_SPAWN_POINTS = [
    { tx: 4, ty: 5, angle: 0 },
    { tx: 24, ty: 4, angle: Math.PI * 0.5 },
    { tx: 44, ty: 4, angle: Math.PI * 0.5 },
    { tx: 52, ty: 14, angle: Math.PI },
    { tx: 52, ty: 34, angle: Math.PI },
    { tx: 44, ty: 51, angle: -Math.PI * 0.5 },
    { tx: 24, ty: 51, angle: -Math.PI * 0.5 },
    { tx: 4, ty: 44, angle: 0 },
    { tx: 4, ty: 24, angle: 0 }
  ];

  function getStarsForScore(score) {
    if (score >= 3500) return 5;
    if (score >= 2000) return 4;
    if (score >= 1000) return 3;
    if (score >= 500) return 2;
    if (score >= 200) return 1;
    return 0;
  }

  function registerMayhem() {
    noMayhemTimer = 0;
    const scoreStars = getStarsForScore(player.score);
    if (scoreStars > wantedLevel) {
      wantedLevel = scoreStars;
    }
  }

  function spawnPoliceCar() {
    let bestSpawn = EDGE_SPAWN_POINTS[0];
    let bestDist = -1;
    for (const sp of EDGE_SPAWN_POINTS) {
      const sx = (sp.tx + 0.5) * TILE_SIZE;
      const sy = (sp.ty + 0.5) * TILE_SIZE;
      const d = Math.hypot(sx - player.x, sy - player.y);
      if (d > 480 && d < 1700) {
        bestSpawn = sp;
        bestDist = d;
        break;
      }
      if (d > bestDist) {
        bestDist = d;
        bestSpawn = sp;
      }
    }

    police.push({
      x: (bestSpawn.tx + 0.5) * TILE_SIZE,
      y: (bestSpawn.ty + 0.5) * TILE_SIZE,
      angle: bestSpawn.angle,
      speed: 180,
      maxSpeed: 340 + wantedLevel * 16,
      isPolice: true,
      hasOfficerOut: false,
      lastTileX: -1,
      lastTileY: -1,
      stuckTimer: 0,
      reverseTimer: 0,
      turnDir: 1
    });
  }

  function hasLineOfSight(x1, y1, x2, y2) {
    const dist = Math.hypot(x2 - x1, y2 - y1);
    if (dist > 620) return false;
    const steps = Math.ceil(dist / 24);
    for (let i = 1; i < steps; i++) {
      const t = i / steps;
      const wx = x1 + (x2 - x1) * t;
      const wy = y1 + (y2 - y1) * t;
      const tile = getTile(Math.floor(wx / TILE_SIZE), Math.floor(wy / TILE_SIZE));
      if (tile === TILE.BUILDING) return false;
    }
    return true;
  }

  function getNearestCardinalIndex(angle) {
    const fx = Math.cos(angle);
    const fy = Math.sin(angle);
    let bestIdx = 0;
    let bestDot = -2;
    for (let i = 0; i < 4; i++) {
      const dot = fx * CARDINAL_DIRS[i].dx + fy * CARDINAL_DIRS[i].dy;
      if (dot > bestDot) {
        bestDot = dot;
        bestIdx = i;
      }
    }
    return bestIdx;
  }

  function pickBestRoadDirection(tx, ty, curIdx, targetTx, targetTy) {
    const oppositeIdx = (curIdx + 2) % 4;
    const validDirs = [];
    for (let i = 0; i < 4; i++) {
      if (i === oppositeIdx) continue;
      const d = CARDINAL_DIRS[i];
      if (getTile(tx + d.dx, ty + d.dy) === TILE.ROAD) {
        validDirs.push(i);
      }
    }

    if (validDirs.length === 0) {
      return oppositeIdx;
    }

    let bestDir = validDirs[0];
    let bestManhattan = Infinity;
    for (const dirIdx of validDirs) {
      const d = CARDINAL_DIRS[dirIdx];
      const ntx = tx + d.dx;
      const nty = ty + d.dy;
      const manhattan = Math.abs(ntx - targetTx) + Math.abs(nty - targetTy);
      if (manhattan < bestManhattan) {
        bestManhattan = manhattan;
        bestDir = dirIdx;
      }
    }
    return bestDir;
  }

  function updatePolice(dt) {
    sirenFlashTime += dt;
    policeSeePlayerNow = false;

    if (wantedLevel === 0) {
      police.length = 0;
      policeOfficers.length = 0;
      bustedTimer = 0;
      return;
    }

    const desiredCops = Math.min(5, wantedLevel);
    while (police.length < desiredCops) {
      spawnPoliceCar();
    }
    while (police.length > desiredCops) {
      police.pop();
    }

    let anyPoliceSeesPlayer = false;
    let copNextToStoppedCar = false;

    const targetX = player.inCar ? player.inCar.x : player.x;
    const targetY = player.inCar ? player.inCar.y : player.y;
    const targetTx = Math.floor(targetX / TILE_SIZE);
    const targetTy = Math.floor(targetY / TILE_SIZE);
    const targetTile = getTile(targetTx, targetTy);
    const playerInPark = targetTile === TILE.PARK || (targetTx >= 16 && targetTx <= 33 && targetTy >= 16 && targetTy <= 33);

    for (const cop of police) {
      const prevX = cop.x;
      const prevY = cop.y;
      const dx = targetX - cop.x;
      const dy = targetY - cop.y;
      const dist = Math.hypot(dx, dy);
      const seesPlayer = hasLineOfSight(cop.x, cop.y, targetX, targetY);

      if (seesPlayer) {
        anyPoliceSeesPlayer = true;
      }

      if (player.inCar && Math.abs(player.inCar.speed) < 10 && dist < 96) {
        copNextToStoppedCar = true;
      }

      if (!player.inCar && dist < 210 && !cop.hasOfficerOut && policeOfficers.length < desiredCops) {
        cop.hasOfficerOut = true;
        const perpX = -Math.sin(cop.angle);
        const perpY = Math.cos(cop.angle);
        const ox = cop.x + perpX * 36;
        const oy = cop.y + perpY * 36;
        policeOfficers.push({
          x: !collidesWithWorld(ox, oy, 24, 24) ? ox : cop.x,
          y: !collidesWithWorld(ox, oy, 24, 24) ? oy : cop.y,
          speed: 175,
          car: cop,
          facingX: dx / (dist || 1),
          facingY: dy / (dist || 1)
        });
      }

      if (!player.inCar && cop.hasOfficerOut) {
        cop.speed *= Math.max(0, 1 - 6 * dt);
        cop.stuckTimer = 0;
        continue;
      }

      if (cop.reverseTimer > 0) {
        cop.reverseTimer -= dt;
        cop.speed = -130;
        const rvx = Math.cos(cop.angle) * cop.speed * dt;
        const rvy = Math.sin(cop.angle) * cop.speed * dt;
        if (!carCollidesWithWorld(cop.x + rvx, cop.y + rvy, cop.angle)) {
          cop.x += rvx;
          cop.y += rvy;
        }
        if (cop.reverseTimer <= 0) {
          cop.angle += (Math.PI * 0.5) * cop.turnDir;
          cop.lastTileX = -1;
          cop.lastTileY = -1;
          cop.speed = 100;
        }
        continue;
      }

      const copTx = Math.floor(cop.x / TILE_SIZE);
      const copTy = Math.floor(cop.y / TILE_SIZE);
      const copTile = getTile(copTx, copTy);

      const canCutPark = playerInPark && seesPlayer;

      if (canCutPark) {
        const desiredAngle = Math.atan2(targetY - cop.y, targetX - cop.x);
        let angleDiff = desiredAngle - cop.angle;
        while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
        while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
        cop.angle += Math.max(-3.4 * dt, Math.min(3.4 * dt, angleDiff));

        const desiredSpeed = copTile === TILE.PARK ? cop.maxSpeed * 0.72 : cop.maxSpeed;
        cop.speed += (desiredSpeed - cop.speed) * Math.min(1, 3.5 * dt);
      } else if (copTile !== TILE.ROAD) {
        const nearestRoad = findNearestTileOfType(cop.x, cop.y, TILE.ROAD);
        const desiredAngle = Math.atan2(nearestRoad.y - cop.y, nearestRoad.x - cop.x);
        let angleDiff = desiredAngle - cop.angle;
        while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
        while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
        cop.angle += Math.max(-4.0 * dt, Math.min(4.0 * dt, angleDiff));
        cop.speed += (220 - cop.speed) * Math.min(1, 4 * dt);
      } else {
        const curIdx = getNearestCardinalIndex(cop.angle);
        if (copTx !== cop.lastTileX || copTy !== cop.lastTileY) {
          cop.lastTileX = copTx;
          cop.lastTileY = copTy;
          const bestDir = pickBestRoadDirection(copTx, copTy, curIdx, targetTx, targetTy);
          if (bestDir !== curIdx) {
            cop.angle = CARDINAL_DIRS[bestDir].angle;
            cop.x = (copTx + 0.5) * TILE_SIZE;
            cop.y = (copTy + 0.5) * TILE_SIZE;
          } else {
            cop.angle = CARDINAL_DIRS[curIdx].angle;
          }
        }

        if (Math.abs(Math.cos(cop.angle)) > 0.5) {
          cop.y += ((copTy + 0.5) * TILE_SIZE - cop.y) * Math.min(1, 6 * dt);
        } else {
          cop.x += ((copTx + 0.5) * TILE_SIZE - cop.x) * Math.min(1, 6 * dt);
        }

        cop.speed += (cop.maxSpeed - cop.speed) * Math.min(1, 3.5 * dt);
      }

      const vx = Math.cos(cop.angle) * cop.speed * dt;
      const vy = Math.sin(cop.angle) * cop.speed * dt;

      if (!carCollidesWithWorld(cop.x + vx, cop.y + vy, cop.angle)) {
        cop.x += vx;
        cop.y += vy;
      } else {
        const pushBackX = cop.x - Math.cos(cop.angle) * 10;
        const pushBackY = cop.y - Math.sin(cop.angle) * 10;
        if (!carCollidesWithWorld(pushBackX, pushBackY, cop.angle)) {
          cop.x = pushBackX;
          cop.y = pushBackY;
        }
        const leftAng = cop.angle - Math.PI * 0.5;
        const rightAng = cop.angle + Math.PI * 0.5;
        if (!carCollidesWithWorld(cop.x + Math.cos(leftAng) * 20, cop.y + Math.sin(leftAng) * 20, leftAng)) {
          cop.angle = leftAng;
        } else {
          cop.angle = rightAng;
        }
        cop.lastTileX = -1;
        cop.lastTileY = -1;
        cop.speed = 0;
      }

      const movedDist = Math.hypot(cop.x - prevX, cop.y - prevY);
      if (dist >= 96 && (Math.abs(cop.speed) < 20 || movedDist < 15 * dt)) {
        cop.stuckTimer += dt;
        if (cop.stuckTimer >= 2.0) {
          cop.stuckTimer = 0;
          cop.reverseTimer = 0.5;
          cop.turnDir = Arcade.random() < 0.5 ? 1 : -1;
        }
      } else {
        cop.stuckTimer = 0;
      }

      if (!player.inCar && Math.abs(cop.speed) > 55 && dist < 38) {
        damagePlayerOnFoot(cop.x, cop.y);
      }
    }

    let officerTouchingPlayer = false;
    for (let i = policeOfficers.length - 1; i >= 0; i--) {
      const off = policeOfficers[i];
      if (player.inCar) {
        if (off.car) off.car.hasOfficerOut = false;
        policeOfficers.splice(i, 1);
        continue;
      }

      const dx = player.x - off.x;
      const dy = player.y - off.y;
      const dist = Math.hypot(dx, dy);

      if (hasLineOfSight(off.x, off.y, player.x, player.y)) {
        anyPoliceSeesPlayer = true;
      }

      if (dist > 1) {
        off.facingX = dx / dist;
        off.facingY = dy / dist;
        const nx = off.x + off.facingX * off.speed * dt;
        const ny = off.y + off.facingY * off.speed * dt;
        if (!collidesWithWorld(nx, off.y, 24, 24)) off.x = nx;
        if (!collidesWithWorld(off.x, ny, 24, 24)) off.y = ny;
      }

      if (dist < 34) {
        officerTouchingPlayer = true;
      }
    }

    policeSeePlayerNow = anyPoliceSeesPlayer;

    if (player.inCar && copNextToStoppedCar) {
      bustedTimer += dt;
      if (bustedTimer >= 3.0) {
        triggerPlayerFailState('busted');
      }
    } else if (!player.inCar && officerTouchingPlayer) {
      bustedTimer += dt;
      if (bustedTimer >= 2.0) {
        triggerPlayerFailState('busted');
      }
    } else {
      bustedTimer = Math.max(0, bustedTimer - dt * 1.5);
    }

    if (!anyPoliceSeesPlayer) {
      noMayhemTimer += dt;
      if (noMayhemTimer >= 20.0) {
        wantedLevel = Math.max(0, wantedLevel - 1);
        noMayhemTimer = 0;
      }
    } else {
      noMayhemTimer = 0;
    }
  }

  function drawPolice(camX, camY) {
    const flashBlue = Math.floor(sirenFlashTime * 10) % 2 === 0;
    const hw = CAR_WIDTH * 0.5;
    const barH = (CAR_WIDTH - 10) * 0.5;

    for (const cop of police) {
      const sx = cop.x - camX;
      const sy = cop.y - camY;
      if (!inView(sx, sy, 140)) continue;
      const spr = getCarSprite('#16181d', 0, 'police');

      ctx.save();
      ctx.translate(sx, sy);
      ctx.rotate(cop.angle);
      ctx.drawImage(spr, -spr.width * 0.5, -spr.height * 0.5);
      drawCarLamps(cop, true);

      // light bar: left half / right half swap red and blue (same timing as before)
      const colA = flashBlue ? '#3d8bff' : '#ff2448';
      const colB = flashBlue ? '#ff2448' : '#3d8bff';
      ctx.fillStyle = colA;
      roundRectPath(ctx, -4, -hw + 5, 8, barH, 1.5);
      ctx.fill();
      ctx.fillStyle = colB;
      roundRectPath(ctx, -4, 0, 8, barH, 1.5);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.fillRect(-2, -hw + 7, 4, 2);
      ctx.fillRect(-2, 2, 4, 2);
      ctx.restore();

      const pa = localToWorld(cop, 0, -hw * 0.5);
      const pb = localToWorld(cop, 0, hw * 0.5);
      queueGlow(flashBlue ? SPR_GLOW_BLUE : SPR_GLOW_RED, pa[0], pa[1], 60, 0.9);
      queueGlow(flashBlue ? SPR_GLOW_RED : SPR_GLOW_BLUE, pb[0], pb[1], 60, 0.9);
      queueGlow(flashBlue ? SPR_GLOW_BLUE : SPR_GLOW_RED, cop.x, cop.y, 150, 0.22);
    }

    for (const off of policeOfficers) {
      const sx = off.x - camX;
      const sy = off.y - camY;
      if (!inView(sx, sy, 40)) continue;
      const s = vstate(off);
      drawCharacter(sx, sy, Math.atan2(off.facingY, off.facingX), {
        shirt: '#1d3557',
        shirtDark: '#152844',
        pants: '#0f1d33',
        skin: PED_SKINS[s.look % PED_SKINS.length],
        hair: '#1a1a1a',
        cap: '#0b1d3a',
        scale: 0.88,
        phase: s.phase,
        moving: s.moving
      });
    }
  }

  // =========================================================================
  // MISSIONS
  // =========================================================================
  const payphones = [
    { name: 'Central Park', tx: 16, ty: 24, x: 16.5 * TILE_SIZE, y: 24.5 * TILE_SIZE },
    { name: 'East Harbor', tx: 54, ty: 37, x: 54.5 * TILE_SIZE, y: 37.5 * TILE_SIZE },
    { name: 'North-West', tx: 6, ty: 6, x: 6.5 * TILE_SIZE, y: 6.5 * TILE_SIZE }
  ];

  // All Mission 1 targets verified on road tiles
  const DRIVE_TARGETS = [
    { tx: 44, ty: 45 },
    { tx: 14, ty: 51 },
    { tx: 44, ty: 14 },
    { tx: 5, ty: 44 }
  ];

  const missionState = {
    index: 0,
    active: false,
    timer: 0,
    markerX: 0,
    markerY: 0,
    mayhemEarned: 0,
    mayhemGoal: 300,
    reachedTwoStars: false,
    hideTimer: 0,
    bannerText: '',
    bannerSub: '',
    bannerColor: '#4cd964',
    bannerTimer: 0,
    pulseTime: 0
  };

  function getNearbyPayphone() {
    if (player.inCar) return null;
    for (const pb of payphones) {
      if (Math.hypot(pb.x - player.x, pb.y - player.y) < 62) {
        return pb;
      }
    }
    return null;
  }

  function startNextMission(payphone) {
    missionState.active = true;
    playBeep(780, 0.14);

    if (missionState.index === 0) {
      missionState.timer = 60;
      let bestTarget = DRIVE_TARGETS[0];
      let bestDist = -1;
      for (const t of DRIVE_TARGETS) {
        if (getTile(t.tx, t.ty) !== TILE.ROAD) continue;
        const tx = (t.tx + 0.5) * TILE_SIZE;
        const ty = (t.ty + 0.5) * TILE_SIZE;
        const d = Math.hypot(tx - payphone.x, ty - payphone.y);
        if (d > bestDist) {
          bestDist = d;
          bestTarget = t;
        }
      }
      const roadCheck = findNearestTileOfType((bestTarget.tx + 0.5) * TILE_SIZE, (bestTarget.ty + 0.5) * TILE_SIZE, TILE.ROAD);
      missionState.markerX = roadCheck.x;
      missionState.markerY = roadCheck.y;

      missionState.bannerText = 'MISSION 1 - Drive to the Marker';
      missionState.bannerSub = 'Reach the yellow marker in 60s';
      missionState.bannerColor = '#ffe047';
      missionState.bannerTimer = 2.0;
    } else if (missionState.index === 1) {
      missionState.timer = 60;
      missionState.mayhemEarned = 0;
      missionState.mayhemGoal = 300;

      missionState.bannerText = 'MISSION 2 - Cause Mayhem';
      missionState.bannerSub = 'Earn 300 mayhem points in 60s';
      missionState.bannerColor = '#ffe047';
      missionState.bannerTimer = 2.0;
    } else {
      missionState.timer = 120;
      missionState.reachedTwoStars = wantedLevel >= 2;
      missionState.hideTimer = 0;

      missionState.bannerText = 'MISSION 3 - Lose the Heat';
      missionState.bannerSub = 'Reach 2 stars, then hide for 20s';
      missionState.bannerColor = '#ffe047';
      missionState.bannerTimer = 2.0;
    }
  }

  function onMissionMayhemScore(amount) {
    if (missionState.active && missionState.index === 1) {
      missionState.mayhemEarned += amount;
    }
  }

  function completeMission(reward, resetWanted = false) {
    missionState.active = false;
    AG.missions++;
    addScore(reward, player.x, player.y - 28, '#4cd964', false);
    if (resetWanted) {
      wantedLevel = 0;
      noMayhemTimer = 0;
      police.length = 0;
      policeOfficers.length = 0;
    }
    missionState.bannerText = `MISSION COMPLETE +${reward}`;
    missionState.bannerSub = '';
    missionState.bannerColor = '#4cd964';
    missionState.bannerTimer = 2.0;
    missionState.index = (missionState.index + 1) % 3;
    playBeep(880, 0.18);
  }

  function failMission() {
    missionState.active = false;
    missionState.bannerText = 'MISSION FAILED';
    missionState.bannerSub = 'Press E at payphone to retry';
    missionState.bannerColor = '#ff3b30';
    missionState.bannerTimer = 2.0;
    playThud(0.7);
  }

  function updateMissions(dt) {
    missionState.pulseTime += dt;
    if (missionState.bannerTimer > 0) {
      missionState.bannerTimer = Math.max(0, missionState.bannerTimer - dt);
    }

    if (!missionState.active) return;

    missionState.timer -= dt;
    if (missionState.timer <= 0) {
      missionState.timer = 0;
      failMission();
      return;
    }

    if (missionState.index === 0) {
      const dist = Math.hypot(player.x - missionState.markerX, player.y - missionState.markerY);
      if (player.inCar && dist < 64) {
        completeMission(500, false);
      }
    } else if (missionState.index === 1) {
      if (missionState.mayhemEarned >= missionState.mayhemGoal) {
        completeMission(500, false);
      }
    } else if (missionState.index === 2) {
      if (wantedLevel >= 2) {
        missionState.reachedTwoStars = true;
      }
      if (missionState.reachedTwoStars) {
        if (!policeSeePlayerNow) {
          missionState.hideTimer += dt;
          if (missionState.hideTimer >= 20.0 || wantedLevel === 0) {
            completeMission(750, true);
          }
        } else {
          missionState.hideTimer = 0;
        }
      }
    }
  }

  function drawMissions(camX, camY) {
    const pulse = 0.5 + 0.5 * Math.sin(missionState.pulseTime * 6);

    for (const pb of payphones) {
      const sx = pb.x - camX;
      const sy = pb.y - camY;

      if (!missionState.active) {
        ctx.fillStyle = `rgba(255,224,71,${(0.08 + pulse * 0.1).toFixed(3)})`;
        fillCircle(ctx, sx, sy, 30);
        ctx.strokeStyle = `rgba(255, 224, 71, ${(0.35 + pulse * 0.45).toFixed(3)})`;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(sx, sy, 20 + pulse * 6, 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      roundRectPath(ctx, sx - 9, sy - 7, 23, 23, 4);
      ctx.fill();

      const bg = ctx.createLinearGradient(sx - 11, sy - 11, sx + 11, sy + 11);
      bg.addColorStop(0, '#ffd84a');
      bg.addColorStop(1, '#d9a400');
      roundRectPath(ctx, sx - 11, sy - 11, 22, 22, 4);
      ctx.fillStyle = bg;
      ctx.fill();
      ctx.strokeStyle = '#1f1f1f';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = '#1f3f8f';
      roundRectPath(ctx, sx - 7, sy - 7, 14, 14, 2);
      ctx.fill();
      // handset
      ctx.fillStyle = '#ffffff';
      roundRectPath(ctx, sx - 5, sy - 1.5, 10, 3, 1.5);
      ctx.fill();
      fillCircle(ctx, sx - 4.5, sy - 1, 2.2);
      fillCircle(ctx, sx + 4.5, sy - 1, 2.2);
      ctx.fillRect(sx - 1, sy + 1.5, 2, 3);
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.fillRect(sx - 10, sy - 10, 20, 1.5);
    }

    if (missionState.active && missionState.index === 0) {
      const mx = missionState.markerX - camX;
      const my = missionState.markerY - camY;
      const r = 34 + pulse * 10;

      ctx.fillStyle = 'rgba(255, 224, 71, 0.22)';
      fillCircle(ctx, mx, my, r);
      ctx.strokeStyle = '#ffe047';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(mx, my, r, 0, Math.PI * 2);
      ctx.stroke();

      ctx.save();
      ctx.setLineDash([10, 8]);
      ctx.lineDashOffset = -missionState.pulseTime * 30;
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = 'rgba(255,240,170,0.85)';
      ctx.beginPath();
      ctx.arc(mx, my, r * 0.68, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      ctx.fillStyle = '#ffe047';
      ctx.beginPath();
      ctx.moveTo(mx, my - 11); ctx.lineTo(mx + 11, my); ctx.lineTo(mx, my + 11); ctx.lineTo(mx - 11, my);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = 'rgba(60,45,0,0.8)';
      ctx.lineWidth = 2;
      ctx.stroke();
      queueGlow(SPR_GLOW_YELLOW, missionState.markerX, missionState.markerY, r * 3, 0.35 + pulse * 0.2);
    }
  }

  // =========================================================================
  // HUD
  // =========================================================================
  function hudFont(weight, size, mono) {
    return `${weight} ${size}px ${mono ? NUM_FONT : UI_FONT}`;
  }

  function hudPanel(x, y, w, h, accent) {
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    roundRectPath(ctx, x + 2, y + 3, w, h, 10);
    ctx.fill();
    const g = ctx.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, 'rgba(30,36,46,0.94)');
    g.addColorStop(1, 'rgba(13,16,21,0.94)');
    roundRectPath(ctx, x, y, w, h, 10);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = accent || 'rgba(208,213,221,0.5)';
    ctx.stroke();
    roundRectPath(ctx, x + 1.5, y + 1.5, w - 3, h - 3, 9);
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.stroke();
  }

  function hudText(text, x, y, font, color, align) {
    ctx.font = font;
    ctx.textAlign = align || 'left';
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillText(text, x + 1, y + 1.5);
    ctx.fillStyle = color;
    ctx.fillText(text, x, y);
  }

  function bigText(text, x, y, size, color) {
    ctx.font = hudFont(900, size);
    ctx.textAlign = 'center';
    ctx.lineJoin = 'round';
    ctx.lineWidth = Math.max(4, size * 0.12);
    ctx.strokeStyle = 'rgba(0,0,0,0.85)';
    ctx.strokeText(text, x, y + 3);
    ctx.strokeText(text, x, y);
    ctx.fillStyle = color;
    ctx.fillText(text, x, y);
  }

  function setLetterSpacing(px) {
    if ('letterSpacing' in ctx) ctx.letterSpacing = px;
  }

  function drawStar(cx, cy, r, on) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + (i * Math.PI) / 5;
      const rr = i % 2 === 0 ? r : r * 0.45;
      const x = cx + Math.cos(a) * rr;
      const y = cy + Math.sin(a) * rr;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    if (on) {
      const g = ctx.createLinearGradient(0, cy - r, 0, cy + r);
      g.addColorStop(0, '#fff07a');
      g.addColorStop(1, '#ffb300');
      ctx.fillStyle = g;
      ctx.fill();
      ctx.strokeStyle = '#7a5200';
      ctx.lineWidth = 1.2;
      ctx.stroke();
    } else {
      ctx.fillStyle = 'rgba(74,82,93,0.55)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(140,150,165,0.6)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }

  function drawHeart(cx, cy, s, filled) {
    ctx.beginPath();
    ctx.moveTo(cx, cy + s * 0.75);
    ctx.bezierCurveTo(cx - s * 1.1, cy + s * 0.05, cx - s * 0.75, cy - s * 0.85, cx, cy - s * 0.3);
    ctx.bezierCurveTo(cx + s * 0.75, cy - s * 0.85, cx + s * 1.1, cy + s * 0.05, cx, cy + s * 0.75);
    ctx.closePath();
    if (filled) {
      ctx.fillStyle = '#ff4d5e';
      ctx.fill();
      ctx.strokeStyle = '#7a0f1a';
      ctx.lineWidth = 1;
      ctx.stroke();
    } else {
      ctx.strokeStyle = 'rgba(207,214,224,0.7)';
      ctx.lineWidth = 1.4;
      ctx.stroke();
    }
  }

  function drawKeyCap(label, rightX, cy) {
    ctx.font = hudFont(700, 13);
    const w = Math.max(24, ctx.measureText(label).width + 14);
    const x = rightX - w;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    roundRectPath(ctx, x, cy - 11, w, 24, 5);
    ctx.fill();
    const g = ctx.createLinearGradient(0, cy - 12, 0, cy + 10);
    g.addColorStop(0, '#4a5363');
    g.addColorStop(1, '#2b313b');
    roundRectPath(ctx, x, cy - 12, w, 22, 5);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.22)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.fillText(label, x + w * 0.5, cy + 4);
    return x;
  }

  function fullOverlay(alpha) {
    ctx.fillStyle = `rgba(4, 7, 12, ${alpha})`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  function centreBand(cy, h, color) {
    const g = ctx.createLinearGradient(0, 0, canvas.width, 0);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(0.2, color);
    g.addColorStop(0.8, color);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, cy - h * 0.5, canvas.width, h);
  }

  function drawHUD() {
    ctx.textBaseline = 'alphabetic';

    // Brief explosion flash overlay
    if (explosionFlashTimer > 0) {
      ctx.fillStyle = `rgba(255, 210, 120, ${(explosionFlashTimer / 0.22) * 0.35})`;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    // START SCREEN
    if (!gameStarted) {
      const bg = ctx.createLinearGradient(0, 0, 0, canvas.height);
      bg.addColorStop(0, 'rgba(6, 10, 18, 0.80)');

  // =========================================================================
  // AUDIO
  // =========================================================================
  const audio = {
    ctx: null,
    muted: false,
    engineOsc: null,
    engineGain: null,
    sirenOsc: null,
    sirenGain: null
  };

  function initAudio() {
    if (audio.ctx) {
      if (audio.ctx.state === 'suspended') audio.ctx.resume();
      return;
    }
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    audio.ctx = new AudioCtx();

    const osc = audio.ctx.createOscillator();
    const gain = audio.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.value = 55;
    gain.gain.value = 0;

    const filter = audio.ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 180;

    osc.connect(filter);
    filter.connect(gain);
    gain.connect(audio.ctx.destination);
    osc.start();

    audio.engineOsc = osc;
    audio.engineGain = gain;

    const sOsc = audio.ctx.createOscillator();
    const sGain = audio.ctx.createGain();
    sOsc.type = 'triangle';
    sOsc.frequency.value = 620;
    sGain.gain.value = 0;
    sOsc.connect(sGain);
    sGain.connect(audio.ctx.destination);
    sOsc.start();

    audio.sirenOsc = sOsc;
    audio.sirenGain = sGain;
  }

  function toggleMute() {
    audio.muted = !audio.muted;
    if (audio.muted && audio.ctx) {
      const now = audio.ctx.currentTime;
      if (audio.engineGain) audio.engineGain.gain.setTargetAtTime(0, now, 0.03);
      if (audio.sirenGain) audio.sirenGain.gain.setTargetAtTime(0, now, 0.03);
    }
  }

  function updateAudio() {
    if (!audio.ctx) return;
    const now = audio.ctx.currentTime;
    const activePlay = gameStarted && !gamePaused && player.status === 'playing';

    if (audio.engineOsc && audio.engineGain) {
      if (audio.muted || !player.inCar || !activePlay) {
        audio.engineGain.gain.setTargetAtTime(0, now, 0.06);
      } else {
        const speedRatio = Math.min(1, Math.abs(player.inCar.speed) / player.inCar.maxSpeed);
        audio.engineOsc.frequency.setTargetAtTime(48 + speedRatio * 75, now, 0.06);
        audio.engineGain.gain.setTargetAtTime(0.03 + speedRatio * 0.035, now, 0.06);
      }
    }

    if (audio.sirenOsc && audio.sirenGain) {
      if (audio.muted || wantedLevel === 0 || police.length === 0 || !activePlay) {
        audio.sirenGain.gain.setTargetAtTime(0, now, 0.08);
      } else {
        const wail = 600 + Math.sin(sirenFlashTime * 6.5) * 220;
        audio.sirenOsc.frequency.setTargetAtTime(wail, now, 0.04);
        audio.sirenGain.gain.setTargetAtTime(0.028, now, 0.08);
      }
    }
  }

  function playBeep(freq = 560, duration = 0.08) {
    if (audio.muted || !audio.ctx) return;
    const now = audio.ctx.currentTime;
    const osc = audio.ctx.createOscillator();
    const gain = audio.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, now);
    gain.gain.setValueAtTime(0.08, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
    osc.connect(gain);
    gain.connect(audio.ctx.destination);
    osc.start(now);
    osc.stop(now + duration);
  }

  function playThud(intensity = 0.5) {
    if (audio.muted || !audio.ctx) return;
    const now = audio.ctx.currentTime;
    const osc = audio.ctx.createOscillator();
    const gain = audio.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(115, now);
    osc.frequency.exponentialRampToValueAtTime(38, now + 0.12);
    gain.gain.setValueAtTime(0.14 * Math.max(0.2, Math.min(1, intensity)), now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
    osc.connect(gain);
    gain.connect(audio.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.14);
  }

  // =========================================================================
  // GAME LOOP
  // =========================================================================
  updateCamera();
  let lastTime = performance.now();

  function drawAgentTimeUp() {
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = 'rgba(6, 10, 18, 0.72)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#ffe047';
    ctx.textAlign = 'center';
    ctx.font = '800 44px system-ui, sans-serif';
    ctx.fillText('TIME UP', canvas.width / 2, canvas.height / 2 - 12);
    ctx.fillStyle = '#ffffff';
    ctx.font = '700 26px system-ui, sans-serif';
    ctx.fillText('Score ' + player.score, canvas.width / 2, canvas.height / 2 + 28);
    ctx.restore();
  }

  function simStep(dt) {
    if (gameStarted && !gamePaused) {
      updatePlayer(dt);
      if (player.status === 'playing') {
        updateCars(dt);
        updateProps(dt);
        updatePeds(dt);
        updatePolice(dt);
        updateMissions(dt);
      }
      updateEffects(dt);
      updateVisuals(dt);
    }
    if (!gamePaused) visualTime += dt;
  }

  function frame(now) {
    const dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;

    // Agent mode steps the world only from arcade.act(), in fixed steps (see AGENT MODE below).
    if (!Arcade.agent) simStep(dt);
    updateAudio();

    const viewW = canvas.width / CAMERA_ZOOM;
    const viewH = canvas.height / CAMERA_ZOOM;

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = WATER_DEEP;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Static ground (baked chunks) + animated water underneath
    drawGround(camera.x, camera.y, viewW, viewH);

    ctx.save();
    ctx.scale(CAMERA_ZOOM, CAMERA_ZOOM);
    drawGroundEffects(camera.x, camera.y);
    drawProps(camera.x, camera.y, viewW, viewH);
    drawMissions(camera.x, camera.y);
    drawVehicleShadows(camera.x, camera.y);
    drawCars(camera.x, camera.y);
    drawPeds(camera.x, camera.y);
    drawPolice(camera.x, camera.y);
    drawPlayer(camera.x, camera.y);
    drawEffects(camera.x, camera.y);
    ctx.restore();

    drawFloatingTexts(camera.x, camera.y);
    drawHUD();
    if (Arcade.agent && AG.ended && player.status !== 'gameover') drawAgentTimeUp();

    requestAnimationFrame(frame);
  }

  // =========================================================================
  // AGENT MODE (arcade/0.1): see /agents.md. Human play above is unchanged.
  // ?agent=1 turns the real-time sim into fixed steps: the world only moves inside arcade.act().
  // One unit is 0.25 s of game time = 5 sim steps of 0.05 s, the largest step the real-time loop ever takes.
  // =========================================================================
  const AG_STEP = 0.05;
  const AG_UNIT_STEPS = 5;
  const AG_UNIT = AG_STEP * AG_UNIT_STEPS;
  const AG_BENCHES = {
    'city-240': {
      label: 'City 240',
      seconds: 240,
      rules: 'Four minutes of game time in the same city (traffic, pedestrians, police) for everyone. Highest score wins. Three busts or wipeouts end the run early.'
    }
  };
  const AG = { ticks: 0, ended: false, missions: 0 };

  function agLimitTicks() {
    const b = Arcade.bench && AG_BENCHES[Arcade.bench];
    return b ? Math.round(b.seconds / AG_STEP) : null;
  }
  function agSeconds() { return Math.round(AG.ticks * AG_STEP * 100) / 100; }
  function agCheckEnd() {
    if (AG.ended) return;
    const lim = agLimitTicks();
    if (player.status === 'gameover' || (lim !== null && AG.ticks >= lim)) {
      AG.ended = true;
      Arcade.onGameOver();
    }
  }

  const AG_HOLD = { up: 'KeyW', down: 'KeyS', left: 'KeyA', right: 'KeyD', handbrake: 'Space' };
  // "up", "up+left 6", "handbrake", "wait 4", "enter", "punch", "respawn"
  function agParse(action) {
    const m = /^([a-z+]+)(?: ([1-9][0-9]?))?$/.exec(action);
    if (!m) return null;
    const n = m[2] ? Number(m[2]) : 1;
    if (n > 40) return null;
    const word = m[1];
    if (word === 'wait') return { hold: [], n, tap: null };
    if (word === 'enter' || word === 'punch' || word === 'respawn') {
      return m[2] ? null : { hold: [], n: 1, tap: word };
    }
    const parts = word.split('+');
    if (new Set(parts).size !== parts.length) return null;
    for (const p of parts) if (!AG_HOLD[p]) return null;
    if (parts.includes('up') && parts.includes('down')) return null;
    if (parts.includes('left') && parts.includes('right')) return null;
    return { hold: parts.map((p) => AG_HOLD[p]), n, tap: null };
  }

  async function agApply(action, pace) {
    const a = agParse(action);
    if (!a) return false;
    const lim = agLimitTicks();
    for (let u = 0; u < a.n && !AG.ended; u++) {
      for (const k of a.hold) keys[k] = true;
      if (u === 0) {
        if (a.tap === 'enter') interactPressed = true;
        if (a.tap === 'punch') attackPressed = true;
        if (a.tap === 'respawn') respawnPressed = true;
      }
      for (let s = 0; s < AG_UNIT_STEPS && !AG.ended; s++) {
        simStep(AG_STEP);
        AG.ticks++;
        agCheckEnd();
        if (lim !== null && AG.ticks >= lim) break;
      }
      for (const k of a.hold) keys[k] = false;
      if (u < a.n - 1 && !AG.ended) await pace();
    }
    interactPressed = false;
    attackPressed = false;
    respawnPressed = false;
    return true;
  }

  const AG_DIRS = ['E', 'SE', 'S', 'SW', 'W', 'NW', 'N', 'NE'];   // +x is east, +y is south
  function agDir(angle) { return AG_DIRS[((Math.round(angle / (Math.PI / 4)) % 8) + 8) % 8]; }
  function agArrow(angle) { return ['>', 'v', '<', '^'][((Math.round(angle / (Math.PI / 2)) % 4) + 4) % 4]; }
  const agT = (v) => Math.round(v / TILE_SIZE * 10) / 10;                 // pixels to tiles, one decimal
  const agRel = (o) => ({ dx: agT(o.x - ref().x), dy: agT(o.y - ref().y), dist: agT(Math.hypot(o.x - ref().x, o.y - ref().y)) });
  function ref() { return player.inCar || player; }
  const agSign = (n) => (n >= 0 ? '+' : '') + n;

  function agCarKind(c) {
    if (c.wrecked) return 'wreck';
    if (c === player.inCar) return 'yours';
    return c.isTraffic ? 'traffic' : 'parked';
  }

  function agWorld() {
    const me = ref();
    const near = (o, r) => Math.hypot(o.x - me.x, o.y - me.y) <= r * TILE_SIZE;
    const R = 12;
    const cs = [];
    cars.forEach((c, id) => {
      if (c === player.inCar || !near(c, R)) return;
      cs.push(Object.assign({ id, kind: agCarKind(c), heading: agDir(c.angle), speed: agT(c.speed), health: Math.round(c.health) }, agRel(c)));
    });
    const cops = police.filter((c) => near(c, R + 6)).map((c) => Object.assign({ kind: 'police car', heading: agDir(c.angle), speed: agT(c.speed) }, agRel(c)));
    const officers = policeOfficers.filter((o) => near(o, R + 6)).map((o) => Object.assign({ kind: 'officer' }, agRel(o)));
    const ps = peds.filter((p) => near(p, R)).map((p) => Object.assign({ fleeing: p.fleeTimer > 0 }, agRel(p)));
    const byDist = (a, b) => a.dist - b.dist;
    return { cars: cs.sort(byDist), police: cops.sort(byDist), officers: officers.sort(byDist), peds: ps.sort(byDist) };
  }

  function agObserve() {
    const mission = missionState.active ? {
      number: missionState.index + 1,
      secondsLeft: Math.round(missionState.timer * 10) / 10,
      goal: ['drive to the marker', 'earn mayhem points', 'reach 2 stars, then stay out of sight'][missionState.index],
      marker: missionState.index === 0 ? agRel({ x: missionState.markerX, y: missionState.markerY }) : null,
      mayhem: missionState.index === 1 ? { earned: missionState.mayhemEarned, goal: missionState.mayhemGoal } : null,
      hiddenSeconds: missionState.index === 2 ? Math.round(missionState.hideTimer * 10) / 10 : null
    } : null;
    const lim = agLimitTicks();
    const car = player.inCar;
    const enterable = !car && cars.some((c) => !c.wrecked && Math.hypot(c.x - player.x, c.y - player.y) < 76);
    const phone = getNearbyPayphone();
    return {
      seconds: agSeconds(),
      secondsLeft: lim !== null ? Math.round((lim - AG.ticks) * AG_STEP * 100) / 100 : null,
      status: player.status,
      at: { x: agT(ref().x), y: agT(ref().y) },
      inCar: !!car,
      car: car ? { heading: agDir(car.angle), speed: agT(car.speed), health: Math.round(car.health) } : null,
      facing: agDir(Math.atan2(player.facingY, player.facingX)),
      health: player.health,
      chancesLeft: 3 - player.failCount,
      wanted: wantedLevel,
      missionsDone: AG.missions,
      mission,
      nextMission: mission ? null : missionState.index + 1,
      payphones: payphones.map((p) => Object.assign({ name: p.name }, agRel(p))),
      can: { enterCar: enterable, exitCar: !!car, usePayphone: !!phone && !missionState.active, respawn: player.status === 'busted' || player.status === 'wasted' },
      world: agWorld()
    };
  }

  const AG_TERRAIN = { [TILE.ROAD]: '.', [TILE.SIDEWALK]: ',', [TILE.BUILDING]: '#', [TILE.PARK]: '"', [TILE.WATER]: '~', [TILE.PIER]: '=' };
  function agText() {
    const o = agObserve();
    const b = Arcade.bench && AG_BENCHES[Arcade.bench];
    const out = [];
    out.push(`harbor-city${Arcade.bench ? ' ' + Arcade.bench : ''} seed ${Arcade.seed}  time ${o.seconds}` + (o.secondsLeft !== null ? `/${o.secondsLeft + o.seconds}` : '') + 's' +
      (AG.ended ? (player.status === 'gameover' ? '  GAME OVER' : '  TIME UP') : ''));
    out.push(`score ${player.score}  wanted ${o.wanted}/5  health ${o.health}/3  chances left ${o.chancesLeft}  missions done ${o.missionsDone}  status ${o.status}`);
    out.push(o.inCar
      ? `you: driving, tile (${o.at.x}, ${o.at.y}), heading ${o.car.heading}, speed ${o.car.speed} tiles/s (max 8.8), car health ${o.car.health}`
      : `you: on foot, tile (${o.at.x}, ${o.at.y}), facing ${o.facing}`);
    const can = Object.keys(o.can).filter((k) => o.can[k]);
    if (can.length) out.push('can now: ' + can.join(', '));
    if (o.mission) {
      const m = o.mission;
      let line = `MISSION ${m.number}: ${m.goal}, ${m.secondsLeft}s left`;
      if (m.marker) line += `, marker M at dx ${agSign(m.marker.dx)} dy ${agSign(m.marker.dy)} (${m.marker.dist} tiles, drive onto it)`;
      if (m.mayhem) line += `, mayhem ${m.mayhem.earned}/${m.mayhem.goal}`;
      if (m.hiddenSeconds !== null) line += `, hidden ${m.hiddenSeconds}/20s, ${wantedLevel >= 2 || missionState.reachedTwoStars ? 'heat reached' : 'reach 2 stars first'}`;
      out.push(line);
    } else {
      out.push(`no mission: stand at a payphone $ on foot and "enter" to start mission ${o.nextMission} of 3`);
    }
    out.push('payphones: ' + o.payphones.map((p) => `${p.name} dx ${agSign(p.dx)} dy ${agSign(p.dy)} (${p.dist})`).join('; '));

    // Map: 31 x 19 tiles around you. Rows are y (south is down), columns x (east is right).
    const me = ref();
    const ctx0 = Math.floor(me.x / TILE_SIZE), cty0 = Math.floor(me.y / TILE_SIZE);
    const HW = 15, HH = 9;
    const grid = [];
    for (let ty = cty0 - HH; ty <= cty0 + HH; ty++) {
      const row = [];
      for (let tx = ctx0 - HW; tx <= ctx0 + HW; tx++) {
        row.push(tx < 0 || ty < 0 || tx >= MAP_SIZE || ty >= MAP_SIZE ? ' ' : (AG_TERRAIN[getTile(tx, ty)] || '?'));
      }
      grid.push(row);
    }
    const put = (x, y, ch) => {
      const gx = Math.floor(x / TILE_SIZE) - (ctx0 - HW), gy = Math.floor(y / TILE_SIZE) - (cty0 - HH);
      if (gx >= 0 && gy >= 0 && gy < grid.length && gx < grid[0].length) grid[gy][gx] = ch;
    };
    for (const p of payphones) put(p.x, p.y, '$');
    if (missionState.active && missionState.index === 0) put(missionState.markerX, missionState.markerY, 'M');
    for (const p of peds) put(p.x, p.y, 'p');
    cars.forEach((c) => put(c.x, c.y, c.wrecked ? 'x' : (c.isTraffic ? 't' : 'c')));
    for (const c of police) put(c.x, c.y, 'P');
    for (const c of policeOfficers) put(c.x, c.y, 'o');
    put(me.x, me.y, '@');
    out.push('map (you @, cars: c parked, t traffic, x wreck, P police, o officer, p pedestrian, $ payphone, M marker)');
    out.push('terrain: . road, , sidewalk, # building (solid), " park, ~ water, = pier');
    let tens = '   ', ones = '   ';
    for (let tx = ctx0 - HW; tx <= ctx0 + HW; tx++) {
      tens += tx < 0 ? ' ' : String(Math.floor(tx / 10) % 10);
      ones += tx < 0 ? ' ' : String(tx % 10);
    }
    out.push(tens, ones);
    grid.forEach((row, i) => out.push(String(cty0 - HH + i).padStart(2, ' ') + ' ' + row.join('')));

    const w = o.world;
    const fmt = (e) => `dx ${agSign(e.dx)} dy ${agSign(e.dy)}`;
    if (w.cars.length) out.push('cars nearby: ' + w.cars.slice(0, 8).map((c) => `#${c.id} ${c.kind} ${fmt(c)} ${c.heading}` + (c.kind === 'traffic' ? ` ${c.speed}t/s` : '')).join('; '));
    if (w.police.length || w.officers.length) {
      out.push('police: ' + w.police.slice(0, 5).map((c) => `car ${fmt(c)} ${c.heading} ${c.speed}t/s`).concat(w.officers.slice(0, 5).map((c) => `officer ${fmt(c)}`)).join('; '));
    }
    if (w.peds.length) out.push('pedestrians nearby: ' + w.peds.slice(0, 8).map((p) => fmt(p) + (p.fleeing ? ' fleeing' : '')).join('; '));
    out.push('dx/dy are tiles from you (east +, south +). A tile is 1 map cell. One unit is 0.25 s: about 1.1 tiles on foot, up to 2.2 tiles in a car at full speed.');
    return out.join('\n');
  }

  function agStart() {
    Arcade.reset();
    peds.length = 0;
    spawnPeds();
    startNewGame();
    policeSeePlayerNow = false;
    AG.ticks = 0;
    AG.ended = false;
    AG.missions = 0;
    gameStarted = true;
    updateCamera();
  }

  Arcade.register({
    id: 'harbor-city',
    benchmarks: AG_BENCHES,
    actions: {
      'up [n]': 'hold W for n units (default 1, max 40; a unit is 0.25 s). On foot: walk north. In a car: accelerate',
      'down [n]': 'hold S. On foot: walk south. In a car: brake, then reverse',
      'left [n]': 'hold A. On foot: walk west. In a car: steer left (only while moving)',
      'right [n]': 'hold D. On foot: walk east. In a car: steer right (only while moving)',
      'up+left [n]': 'hold two keys at once; also up+right, down+left, down+right',
      'handbrake [n]': 'hold Space in a car: brake hard; with left or right (left+handbrake) it turns tighter. Spends a unit on foot',
      'wait [n]': 'do nothing for n units; the world keeps moving',
      enter: 'press E: get in or out of a car (nearest within 1.6 tiles), or take the call at a payphone (within 1.3 tiles, on foot)',
      punch: 'press Space on foot: swing a fist (cooldown 0.35 s); hitting pedestrians scores',
      respawn: 'press R after a bust or wipeout: back to the start, wanted level cleared (a chance is spent)'
    },
    start: agStart,
    ready: () => gameStarted && !AG.ended,
    over: () => AG.ended,
    score: () => player.score,
    stats: () => ({ seconds: agSeconds(), missions: AG.missions, chancesUsed: player.failCount }),
    observe: agObserve,
    text: agText,
    apply: agApply
  });

  // Test hook, agent mode only (tools/harbor/check.mjs): a fingerprint of everything the rules read, across the
  // whole city, not just the window observe() shows. Cosmetic state (renderState, smoke, sparks) is left out.
  function agStateHash() {
    const s = JSON.stringify({ cars, peds, police, policeOfficers, props, player, missionState, wantedLevel,
      noMayhemTimer, bustedTimer, policeSeePlayerNow, AG });
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return (h >>> 0).toString(16).padStart(8, '0');
  }
  if (Arcade.agent) window.__harbor = { stateHash: agStateHash };

  requestAnimationFrame(frame);
})();
</script>
<script src="../views.js" defer></script>
</body>
