<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>NIGHT SHIFT</title>
<script src="../arcade.js"></script>
<style>
:root{--bg:#0A0A0B;--panel:#141417;--panel-2:#1C1C20;--border:#25252B;--text:#F5F5F0;--muted:#9A9AA0;--accent:#4F46E5;--green:#C8FF00}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;overscroll-behavior:none}
button{font:inherit}
.app{max-width:960px;margin:0 auto;padding:12px 12px 24px;display:flex;flex-direction:column;gap:10px}
header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:10px}
h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-0.04em}
h1 span{color:var(--accent)}
.sub{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
#scorebar{background:#aaaaaa;color:#000;padding:4px 8px;font-size:13px;font-weight:700;white-space:pre-wrap}
#scene{display:block;width:100%;height:auto;aspect-ratio:320/200;image-rendering:pixelated;background:#000;border:1px solid var(--border);touch-action:manipulation;cursor:pointer}
#log{height:150px;overflow-y:auto;background:#000;border:1px solid var(--border);padding:8px 10px;font-size:14px;line-height:1.4}
#log p{margin:0 0 6px}
#log p.cmd{color:var(--muted)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row b{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);min-width:64px}
.row button{background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 10px;min-height:40px;font-size:12px;cursor:pointer}
.row button:hover{background:var(--panel-2)}
.row button.on{background:var(--accent);border-color:var(--accent)}
#cmdform{display:flex;gap:6px}
#cmd{flex:1;min-width:0;background:#000;color:var(--green);border:1px solid var(--border);border-radius:8px;padding:10px;font:inherit;font-size:16px}
#cmdform button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:0 16px;font-weight:700;cursor:pointer}
#overbanner{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px;text-align:center}
.arcade-embed header,.arcade-embed #verbs-row,.arcade-embed #cmdform{display:none}
@media (max-width:520px){h1{font-size:22px}#log{height:130px}}
</style>
</head>
<body>
<div class="app" id="app">
  <header><h1>NIGHT <span>SHIFT</span></h1><div class="sub">a parser adventure &middot; 1989 &middot; agents welcome</div></header>
  <div id="scorebar">Score: 0 of 0</div>
  <canvas id="scene" width="320" height="200" aria-label="Scene picture"></canvas>
  <div id="log" aria-live="polite"></div>
  <div id="overbanner" hidden>The shift is over. Use DOWNLOAD RUN (JSON) in the bar at the top of the page to save your run, or reload to play again.</div>
  <form id="cmdform" autocomplete="off"><input id="cmd" aria-label="Type a command" placeholder="type a command, or tap a verb" autocapitalize="off" autocorrect="off" spellcheck="false"/><button type="submit">GO</button></form>
  <div class="row" id="verbs-row"><b>Verbs</b><span class="row" id="verbs"></span></div>
  <div class="row"><b>Exits</b><span class="row" id="exits"></span></div>
  <div class="row"><b>Carrying</b><span class="row" id="inventory"></span></div>
</div>
<script type="module">
import { arcadeAdapter } from "./engine.js";
import { mount } from "./ui.js";

const world = await (await fetch("./world.json", { cache: "no-store" })).json();
let ui = null;
// The adapter creates the game in start() (arcade.js calls it once the page is registered), so the UI mounts
// from onStart and reads that same game.
Arcade.register(arcadeAdapter({
  world,
  random: Arcade.random,
  bench: () => Arcade.bench,
  seed: () => Arcade.seed,
  reset: Arcade.reset,
  onStart: (game) => { ui = mount(document.getElementById("app"), game, world, (text) => Arcade.onKeyAction(text)); },
  onChange: () => ui && ui.repaint(),
  onOver: () => Arcade.onGameOver(),
}));
</script>
</body>
</html>
